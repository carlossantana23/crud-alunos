<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
</head>
<body>
    <h1>Cadastro de Alunos</h1>
    
    <form id="formAluno">
        <label for="matricula">Matrícula:</label><br>
        <input type="text" id="matricula" required><br><br>

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" required><br><br>

        <label for="data_nascimento">Data de Nascimento (DD/MM/AAAA):</label><br>
        <input type="text" id="data_nascimento" placeholder="DD/MM/YYYY"><br><br>

        <label for="turma">Turma:</label><br>
        <input type="text" id="turma"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" required><br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <p id="mensagem"></p>

    <script>
        const form = document.getElementById('formAluno');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const dados = {
                matricula: document.getElementById('matricula').value,
                nome: document.getElementById('nome').value,
                data_nascimento: document.getElementById('data_nascimento').value,
                turma: document.getElementById('turma').value,
                email: document.getElementById('email').value
            };

            try {
                const resposta = await fetch('http://localhost:3000/alunos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (resposta.ok) {
                    mensagem.textContent = 'Cadastrado com sucesso!';
                    form.reset();
                } else {
                    mensagem.textContent = 'Erro ao cadastrar.';
                }
            } catch (erro) {
                console.error('Erro de rede:', erro);
                mensagem.textContent = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
